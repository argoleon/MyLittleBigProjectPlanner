# pgBackRest configuration (https://pgbackrest.org/configuration.html).
#
# Every option can be overridden with an environment variable named
# PGBACKREST_<OPTION> (e.g. PGBACKREST_REPO1_RETENTION_FULL=8), which is how
# the compose file and deploy/.env tune it. The repository encryption key is
# never written here: it comes from the pgbackrest_cipher_pass secret.
#
# Default repository: the pgbackrest-repo volume. To keep backups off the
# machine, point repo1 at any S3 storage instead (see deploy/README.md).

[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
# Full backups kept; the WAL needed to restore them is kept with them.
repo1-retention-full=4
repo1-retention-full-type=count
compress-type=zst
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=off

[main]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
