# Runs the production stack (compose.yaml) on a development machine, for
# `just compose-up` and the deployment tests (`just compose-test`):
#
# - images built from the sources (mlbpp-local/*:local);
# - https://localhost:18443, or https://127.0.0.1:18443 (http://…:18081
#   redirects to it), with Traefik's self-signed certificate instead of
#   Let's Encrypt;
# - emails caught by Mailpit (http://localhost:18026) instead of an SMTP
#   server.
#
# The justfile and deploy/tests/lib.sh set MLBPP_DOMAIN=localhost,
# MLBPP_REGISTRY=mlbpp-local, MLBPP_VERSION=local and MLBPP_PUBLIC_PORT=:18443
# for it. The routes below accept 127.0.0.1 besides localhost here, whatever
# starts or restarts the stack.

x-build: &build
  context: ..


services:
  traefik:
    command: !override
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=mlbpp_edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --ping=true
      - --log.format=json
      - --accesslog=true
      - --accesslog.format=json
    ports: !override
      - "127.0.0.1:${LOCAL_HTTP_PORT:-18081}:80"
      - "127.0.0.1:${LOCAL_HTTPS_PORT:-18443}:443"

  web:
    build:
      <<: *build
      dockerfile: deploy/docker/web.Dockerfile
    # The routes accept localhost, its subdomains (one per tenant) and
    # 127.0.0.1; parenthesized, since the API and MCP routes add a path prefix.
    labels:
      - traefik.http.routers.mlbpp-web.rule=(Host(`localhost`) || Host(`127.0.0.1`) || HostRegexp(`^[a-z0-9-]+[.]localhost$$`))

  api:
    build:
      <<: *build
      dockerfile: deploy/docker/backend.Dockerfile
      target: api
    labels:
      - traefik.http.routers.mlbpp-api.rule=(Host(`localhost`) || Host(`127.0.0.1`) || HostRegexp(`^[a-z0-9-]+[.]localhost$$`)) && PathPrefix(`/api`)

  worker:
    build:
      <<: *build
      dockerfile: deploy/docker/backend.Dockerfile
      target: worker
    environment:
      SMTP_URL_FILE: ""
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      mailpit:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.28
    # Edge too: the end-to-end tests read the emails from their container.
    networks: [backend, edge]
    ports:
      - "127.0.0.1:${LOCAL_MAILPIT_PORT:-18026}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp:
    build:
      <<: *build
      dockerfile: deploy/docker/backend.Dockerfile
      target: mcp
    labels:
      - traefik.http.routers.mlbpp-mcp.rule=(Host(`localhost`) || Host(`127.0.0.1`) || HostRegexp(`^[a-z0-9-]+[.]localhost$$`)) && PathPrefix(`/mcp`)

  postgres:
    build:
      <<: *build
      dockerfile: deploy/docker/postgres.Dockerfile

  # Same images as api and postgres, built above: never pulled.
  migrate:
    pull_policy: never
  backup:
    pull_policy: never
  keycloak-db-init:
    pull_policy: never
