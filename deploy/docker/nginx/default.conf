# Static files of the two Angular applications. TLS and routing to the api
# and mcp services are done by Traefik in front.

# Liveness probe on its own port, never routed by Traefik: used by the
# Docker HEALTHCHECK and by Traefik's own health checks of the instances.
server {
    listen 8081;
    server_tokens off;
    access_log off;

    location = /health/live {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        return 404;
    }
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed file names: cache for a year.
    location ~* \.(?:js|css|woff2?|ico|svg|png)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Translations change with each release, under the same name.
    location ~* /i18n/[a-z]+\.json$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Request portal: client-side routing falls back on its index.html.
    location /portal/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /portal/index.html;
    }

    # Internal application.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
