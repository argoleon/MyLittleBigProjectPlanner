# Production stack of My Little Big Project Planner, on a single machine
# (specification §17). Documentation: deploy/README.md.
#
#   docker compose -f deploy/compose.yaml up -d --wait
#   docker compose -f deploy/compose.yaml up -d --scale api=3 --scale worker=2
#   docker compose -f deploy/compose.yaml --profile sso --profile observability up -d
#
# Variables come from deploy/.env (see deploy/.env.example); secrets from the
# files of deploy/secrets/ (`just compose-secrets` creates them). Nothing
# sensitive is written in this file.
#
# The development machine runs the same file with compose.local.yaml on top
# (`just compose-up`); the inner development loop uses compose.dev.yaml.

name: mlbpp

x-restart: &restart
  restart: unless-stopped

x-rust-logs: &rust-logs
  RUST_LOG: ${RUST_LOG:-info}
  SHUTDOWN_GRACE_SECS: ${SHUTDOWN_GRACE_SECS:-30}

# Public routes answer on MLBPP_DOMAIN and its subdomains (one per tenant in
# multi-tenant mode), unless MLBPP_HOST_RULE replaces that Traefik rule.
# See "TLS" in deploy/README.md.

services:
  # --- Edge ------------------------------------------------------------------

  traefik:
    <<: *restart
    image: traefik:v3.7
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=mlbpp_edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --ping=true
      - --log.format=json
      - --accesslog=true
      - --accesslog.format=json
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [edge]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Application services (stateless, replicable) --------------------------

  web:
    <<: *restart
    image: ${MLBPP_REGISTRY:-ghcr.io/argoleon}/mlbpp-web:${MLBPP_VERSION:-latest}
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.mlbpp-web.rule=${MLBPP_HOST_RULE:-(Host(`${MLBPP_DOMAIN:?set MLBPP_DOMAIN in deploy/.env}`) || HostRegexp(`^[a-z0-9-]+[.]${MLBPP_DOMAIN}$`))}
      - traefik.http.routers.mlbpp-web.priority=1
      - traefik.http.services.mlbpp-web.loadbalancer.server.port=8080
      - traefik.http.services.mlbpp-web.loadbalancer.healthcheck.path=/health/live
      - traefik.http.services.mlbpp-web.loadbalancer.healthcheck.port=8081

  api:
    <<: *restart
    image: ${MLBPP_REGISTRY:-ghcr.io/argoleon}/mlbpp-api:${MLBPP_VERSION:-latest}
    environment:
      <<: *rust-logs
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      TENANCY_MODE: ${TENANCY_MODE:-single}
      TENANT_DEFAULT_SLUG: ${TENANT_DEFAULT_SLUG:-default}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-}
    secrets: [database_url]
    networks: [edge, backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.http.routers.mlbpp-api.rule=${MLBPP_HOST_RULE:-(Host(`${MLBPP_DOMAIN}`) || HostRegexp(`^[a-z0-9-]+[.]${MLBPP_DOMAIN}$`))} && PathPrefix(`/api`)
      - traefik.http.services.mlbpp-api.loadbalancer.server.port=8080
      - traefik.http.services.mlbpp-api.loadbalancer.healthcheck.path=/health/live

  worker:
    <<: *restart
    image: ${MLBPP_REGISTRY:-ghcr.io/argoleon}/mlbpp-worker:${MLBPP_VERSION:-latest}
    environment:
      <<: *rust-logs
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully

  mcp:
    <<: *restart
    image: ${MLBPP_REGISTRY:-ghcr.io/argoleon}/mlbpp-mcp:${MLBPP_VERSION:-latest}
    environment:
      <<: *rust-logs
      MCP_API_BASE_URL: http://api:8080
    networks: [edge, backend]
    labels:
      - traefik.enable=true
      - traefik.http.routers.mlbpp-mcp.rule=${MLBPP_HOST_RULE:-(Host(`${MLBPP_DOMAIN}`) || HostRegexp(`^[a-z0-9-]+[.]${MLBPP_DOMAIN}$`))} && PathPrefix(`/mcp`)
      - traefik.http.services.mlbpp-mcp.loadbalancer.server.port=8090
      - traefik.http.services.mlbpp-mcp.loadbalancer.healthcheck.path=/health/live

  # Applies pending database migrations, then exits; api and worker wait for it.
  migrate:
    image: ${MLBPP_REGISTRY:-ghcr.io/argoleon}/mlbpp-api:${MLBPP_VERSION:-latest}
    command: ["migrate"]
    environment:
      <<: *rust-logs
      DATABASE_MIGRATION_URL_FILE: /run/secrets/database_migration_url
    secrets: [database_migration_url]
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  # --- Data -------------------------------------------------------------------

  postgres:
    <<: *restart
    image: ${MLBPP_REGISTRY:-ghcr.io/argoleon}/mlbpp-postgres:${MLBPP_VERSION:-latest}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=main archive-push %p
      # A WAL segment is archived at least this often: bounds the data loss
      # between backups (target: 15 minutes, specification §19).
      - -c
      - archive_timeout=${POSTGRES_ARCHIVE_TIMEOUT:-300}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: postgres
      MLBPP_DB_NAME: mlbpp
      MLBPP_OWNER_PASSWORD_FILE: /run/secrets/mlbpp_owner_password
      MLBPP_APP_PASSWORD_FILE: /run/secrets/mlbpp_app_password
      PGBACKREST_REPO1_CIPHER_PASS_FILE: /run/secrets/pgbackrest_cipher_pass
    secrets: [postgres_password, mlbpp_owner_password, mlbpp_app_password, pgbackrest_cipher_pass]
    volumes:
      - postgres-data:/var/lib/postgresql
      - postgres-run:/var/run/postgresql
      - pgbackrest-repo:/var/lib/pgbackrest
    networks: [backend]
    shm_size: 256mb
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mlbpp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Scheduled pgBackRest backups (full weekly, incremental daily); WAL
  # archiving is done by the postgres service itself.
  backup:
    <<: *restart
    image: ${MLBPP_REGISTRY:-ghcr.io/argoleon}/mlbpp-postgres:${MLBPP_VERSION:-latest}
    command: ["backup-scheduler.sh"]
    user: postgres
    environment:
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_FULL_DAY: ${BACKUP_FULL_DAY:-7}
      PGBACKREST_REPO1_RETENTION_FULL: ${BACKUP_RETENTION_FULL:-4}
      PGBACKREST_REPO1_CIPHER_PASS_FILE: /run/secrets/pgbackrest_cipher_pass
    secrets: [pgbackrest_cipher_pass]
    volumes:
      - postgres-data:/var/lib/postgresql:ro
      - postgres-run:/var/run/postgresql
      - pgbackrest-repo:/var/lib/pgbackrest
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/backup-ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s

  valkey:
    <<: *restart
    image: valkey/valkey:9.2-alpine
    user: valkey
    # The password is written to a configuration file, never to the command line.
    entrypoint: ["sh", "-c"]
    command:
      - |
        printf 'requirepass "%s"\n' "$$(cat /run/secrets/valkey_password)" > /tmp/valkey.conf
        exec valkey-server /tmp/valkey.conf --appendonly yes --dir /data
    secrets: [valkey_password]
    volumes:
      - valkey-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/valkey_password)\" valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3

  # S3-compatible file storage (attachments, L05).
  seaweedfs:
    <<: *restart
    image: chrislusf/seaweedfs:4.05
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
      - -filer
      - -s3
      - -s3.port=8333
      - -s3.config=/run/secrets/seaweedfs_s3_config
    secrets: [seaweedfs_s3_config]
    volumes:
      - seaweedfs-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Antivirus scanning of attachments (L05). Downloads its signatures on
  # first start: allow a few minutes.
  clamav:
    <<: *restart
    image: clamav/clamav:1.5
    volumes:
      - clamav-db:/var/lib/clamav
    networks: [backend]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s

  # --- Profile "sso": Keycloak (SAML, LDAP) -----------------------------------

  # Creates Keycloak's database and role in the shared PostgreSQL, idempotently.
  keycloak-db-init:
    profiles: [sso]
    image: ${MLBPP_REGISTRY:-ghcr.io/argoleon}/mlbpp-postgres:${MLBPP_VERSION:-latest}
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        export PGPASSWORD="$$(cat /run/secrets/postgres_password)"
        kc_pw="$$(cat /run/secrets/keycloak_db_password)"
        psql -h postgres -U postgres -v ON_ERROR_STOP=1 -v pw="$$kc_pw" <<'SQL'
        SELECT format('CREATE ROLE keycloak LOGIN PASSWORD %L', :'pw')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'keycloak') \gexec
        SELECT format('ALTER ROLE keycloak PASSWORD %L', :'pw') \gexec
        SELECT 'CREATE DATABASE keycloak OWNER keycloak'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak') \gexec
        SQL
    secrets: [postgres_password, keycloak_db_password]
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  keycloak:
    <<: *restart
    profiles: [sso]
    image: quay.io/keycloak/keycloak:26.6
    entrypoint: ["bash", "-c"]
    command:
      - |
        export KC_DB_PASSWORD="$$(cat /run/secrets/keycloak_db_password)"
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)"
        exec /opt/keycloak/bin/kc.sh start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HOSTNAME: https://${MLBPP_DOMAIN}${MLBPP_PUBLIC_PORT:-}/auth
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    secrets: [keycloak_db_password, keycloak_admin_password]
    networks: [edge, backend]
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    healthcheck:
      # No curl in the image: plain HTTP over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s
    labels:
      - traefik.enable=true
      - traefik.http.routers.mlbpp-keycloak.rule=Host(`${MLBPP_DOMAIN}`) && PathPrefix(`/auth`)
      - traefik.http.services.mlbpp-keycloak.loadbalancer.server.port=8080

  # --- Profile "observability": Prometheus, Loki, Grafana ---------------------
  # Separate services: their licenses do not affect the MIT code (§19).

  prometheus:
    <<: *restart
    profiles: [observability]
    image: prom/prometheus:v3.11.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6

  loki:
    <<: *restart
    profiles: [observability]
    image: grafana/loki:3.7.0
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks: [edge]
    # No shell nor HTTP client in the image for a health check; readiness is
    # GET /ready on port 3100 (checked by deploy/tests/profiles.sh).

  # Ships the logs of every container of the stack to Loki.
  alloy:
    <<: *restart
    profiles: [observability]
    image: grafana/alloy:v1.15.0
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks: [edge]
    depends_on:
      loki:
        condition: service_started

  grafana:
    <<: *restart
    profiles: [observability]
    image: grafana/grafana:12.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SERVER_ROOT_URL: https://${MLBPP_DOMAIN}${MLBPP_PUBLIC_PORT:-}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: [grafana_admin_password]
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/mlbpp.yaml:ro
      - grafana-data:/var/lib/grafana
    networks: [edge]
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    # No shell nor HTTP client in the image for a health check; readiness is
    # GET /api/health on port 3000 (checked by deploy/tests/profiles.sh).
    labels:
      - traefik.enable=true
      - traefik.http.routers.mlbpp-grafana.rule=Host(`${MLBPP_DOMAIN}`) && PathPrefix(`/grafana`)
      - traefik.http.services.mlbpp-grafana.loadbalancer.server.port=3000

networks:
  # Traefik and the services it exposes.
  edge:
  # Services and their data stores; never exposed.
  backend:

volumes:
  postgres-data:
  postgres-run:
  pgbackrest-repo:
  valkey-data:
  seaweedfs-data:
  clamav-db:
  letsencrypt:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:

# Files created by `just compose-secrets` (or by hand, see deploy/README.md).
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  mlbpp_owner_password:
    file: ./secrets/mlbpp_owner_password
  mlbpp_app_password:
    file: ./secrets/mlbpp_app_password
  database_url:
    file: ./secrets/database_url
  database_migration_url:
    file: ./secrets/database_migration_url
  pgbackrest_cipher_pass:
    file: ./secrets/pgbackrest_cipher_pass
  valkey_password:
    file: ./secrets/valkey_password
  seaweedfs_s3_config:
    file: ./secrets/seaweedfs_s3_config
  keycloak_db_password:
    file: ./secrets/keycloak_db_password
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
