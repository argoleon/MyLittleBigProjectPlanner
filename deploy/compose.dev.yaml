# Development environment: everything runs in containers, nothing natively.
# Drive it through the justfile (`just dev`, `just test`, `just lint`…).
#
#   postgres  PostgreSQL 18 (host port 54329, for database tools)
#   valkey    Valkey: sessions, rate limits (host port 56379)
#   mailpit   SMTP catcher: every email sent in development lands here,
#             readable on http://127.0.0.1:18025
#   backend   Rust toolchain for one-off commands: build, lint, test, migrate
#   api       REST API with live reload, on http://127.0.0.1:18080
#   worker    background jobs (emails…) with live reload
#   web       Node toolchain for one-off commands (npm, ng, client generator,
#             unit tests); with the profile "web", the dev server of the
#             internal application on http://127.0.0.1:4200, proxying /api
#             to the api service
#   e2e       Playwright and its browsers, for the end-to-end tests
#             (profile "e2e")
#
# The production stack is deploy/compose.yaml (deploy/README.md).
#
# Build caches are named volumes. CI replaces them with directories it can
# save between runs: CARGO_HOME_MOUNT, CARGO_TARGET_MOUNT and NPM_CACHE_MOUNT
# hold absolute paths (bind mounts) instead of volume names.
# Passwords here are for local development only.

name: mlbpp-dev

x-backend: &backend
  build:
    context: .
    dockerfile: dev/backend.Dockerfile
  image: mlbpp-dev-backend
  volumes:
    - ..:/workspace
    - ${CARGO_HOME_MOUNT:-cargo-home}:/cargo
  environment: &backend-env
    SQLX_OFFLINE: "true"
    RUST_LOG: info
    # Superuser URL used by testkit to create one database per test.
    TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@postgres:5432/postgres # gitleaks:allow
    # Owner-role URL of the development database (migrate, sqlx prepare).
    DEV_DATABASE_OWNER_URL: postgres://mlbpp_owner:mlbpp_owner_dev@postgres:5432/mlbpp # gitleaks:allow
    # Valkey and SMTP catcher of the integration tests (keys and recipients
    # are unique per test).
    TEST_VALKEY_URL: redis://valkey:6379
    TEST_SMTP_URL: smtp://mailpit:1025
    TEST_MAILPIT_URL: http://mailpit:8025
    # OIDC provider of the integration tests.
    TEST_OIDC_ISSUER: http://keycloak:8080/realms/mlbpp-test
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy
    mailpit:
      condition: service_healthy
    keycloak:
      condition: service_healthy

services:
  valkey:
    image: valkey/valkey:9.2-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.28
    ports:
      - "127.0.0.1:18025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # OIDC provider of the integration tests: realm "mlbpp-test" (client
  # "mlbpp", users alice, bob, carol; deploy/dev/keycloak/). Reached as
  # http://keycloak:8080 from the containers only (the issuer names this host).
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command:
      - start-dev
      - --import-realm
      - --hostname=http://keycloak:8080
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin # gitleaks:allow (development only)
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # No curl in the image: plain HTTP over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      MLBPP_DB_NAME: mlbpp
      MLBPP_OWNER_PASSWORD: mlbpp_owner_dev
      MLBPP_APP_PASSWORD: mlbpp_app_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    <<: *backend
    volumes:
      - ..:/workspace
      - ${CARGO_HOME_MOUNT:-cargo-home}:/cargo
      - ${CARGO_TARGET_MOUNT:-cargo-target}:/cargo-target
    profiles: ["tools"]

  api:
    <<: *backend
    volumes:
      - ..:/workspace
      - ${CARGO_HOME_MOUNT:-cargo-home}:/cargo
      # Separate build directory, so `just test` never waits for the server's build.
      - api-target:/cargo-target
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    environment:
      <<: *backend-env
      API_BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://mlbpp_app:mlbpp_app_dev@postgres:5432/mlbpp # gitleaks:allow
      DATABASE_MIGRATION_URL: postgres://mlbpp_owner:mlbpp_owner_dev@postgres:5432/mlbpp # gitleaks:allow
      TENANCY_MODE: single
      TENANT_DEFAULT_SLUG: default
      VALKEY_URL: redis://valkey:6379
      # Links in emails open the development front end.
      PUBLIC_URL: http://127.0.0.1:4200
      # The development front end is served over plain http.
      SESSION_COOKIE_SECURE: "false"
      # Local identity providers may run over plain HTTP.
      OIDC_ALLOW_HTTP: "true"
      # Encrypts the stored secrets (TOTP, OIDC); development only (32 bytes in base64).
      DATA_ENCRYPTION_KEY: ZGV2ZWxvcG1lbnQga2V5IG9ubHksIDMyIGJ5dGVzISE= # gitleaks:allow
      # Readable logs in the terminal; production writes JSON lines.
      LOG_FORMAT: text
    command:
      - watchexec
      - --restart
      - --watch=crates
      - --watch=migrations
      - --exts=rs,toml,sql
      # File events do not cross the Docker Desktop VM boundary: poll instead.
      - --poll=1s
      - --stop-signal=SIGTERM
      - --
      - cargo run --locked -p api
    ports:
      - "127.0.0.1:18080:8080"

  worker:
    <<: *backend
    volumes:
      - ..:/workspace
      - ${CARGO_HOME_MOUNT:-cargo-home}:/cargo
      - worker-target:/cargo-target
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    environment:
      <<: *backend-env
      DATABASE_URL: postgres://mlbpp_app:mlbpp_app_dev@postgres:5432/mlbpp # gitleaks:allow
      VALKEY_URL: redis://valkey:6379
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: My Little Big Project Planner <noreply@mlbpp.localhost>
      LOG_FORMAT: text
    command:
      - watchexec
      - --restart
      - --watch=crates
      - --exts=rs,toml
      - --poll=1s
      - --stop-signal=SIGTERM
      - --
      - cargo run --locked -p worker

  web:
    build:
      context: .
      dockerfile: dev/web.Dockerfile
    image: mlbpp-dev-web
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    volumes:
      - ..:/workspace
      - ${NPM_CACHE_MOUNT:-npm-cache}:/npm-cache
    # File events do not cross the Docker Desktop VM boundary: poll instead.
    command: ["npx", "ng", "serve", "app", "--host", "0.0.0.0", "--port", "4200", "--poll", "1000"]
    ports:
      - "127.0.0.1:4200:4200"
    profiles: ["web"]

  e2e:
    build:
      context: .
      dockerfile: dev/e2e.Dockerfile
    image: mlbpp-dev-e2e
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    volumes:
      - ..:/workspace
      - ${NPM_CACHE_MOUNT:-npm-cache}:/npm-cache
    # Chromium needs more shared memory than Docker's default 64 MB.
    ipc: host
    profiles: ["e2e"]

volumes:
  postgres-data:
  cargo-home:
  cargo-target:
  api-target:
  worker-target:
  npm-cache:
