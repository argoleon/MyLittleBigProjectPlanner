# Development environment: everything runs in containers, nothing natively.
# Drive it through the justfile (`just dev`, `just test`, `just lint`…).
#
#   postgres  PostgreSQL 18 (host port 54329, for database tools)
#   backend   Rust toolchain for one-off commands: build, lint, test, migrate
#   api       REST API with live reload, on http://127.0.0.1:18080
#   web       Node toolchain for one-off commands (npm, ng, client generator,
#             unit tests); with the profile "web", the dev server of the
#             internal application on http://127.0.0.1:4200, proxying /api
#             to the api service
#   e2e       Playwright and its browsers, for the end-to-end tests
#             (profile "e2e")
#
# The production stack is deploy/compose.yaml (deploy/README.md).
#
# Build caches are named volumes. CI replaces them with directories it can
# save between runs: CARGO_HOME_MOUNT, CARGO_TARGET_MOUNT and NPM_CACHE_MOUNT
# hold absolute paths (bind mounts) instead of volume names.
# Passwords here are for local development only.

name: mlbpp-dev

x-backend: &backend
  build:
    context: .
    dockerfile: dev/backend.Dockerfile
  image: mlbpp-dev-backend
  volumes:
    - ..:/workspace
    - ${CARGO_HOME_MOUNT:-cargo-home}:/cargo
  environment: &backend-env
    SQLX_OFFLINE: "true"
    RUST_LOG: info
    # Superuser URL used by testkit to create one database per test.
    TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@postgres:5432/postgres # gitleaks:allow
    # Owner-role URL of the development database (migrate, sqlx prepare).
    DEV_DATABASE_OWNER_URL: postgres://mlbpp_owner:mlbpp_owner_dev@postgres:5432/mlbpp # gitleaks:allow
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      MLBPP_DB_NAME: mlbpp
      MLBPP_OWNER_PASSWORD: mlbpp_owner_dev
      MLBPP_APP_PASSWORD: mlbpp_app_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    <<: *backend
    volumes:
      - ..:/workspace
      - ${CARGO_HOME_MOUNT:-cargo-home}:/cargo
      - ${CARGO_TARGET_MOUNT:-cargo-target}:/cargo-target
    profiles: ["tools"]

  api:
    <<: *backend
    volumes:
      - ..:/workspace
      - ${CARGO_HOME_MOUNT:-cargo-home}:/cargo
      # Separate build directory, so `just test` never waits for the server's build.
      - api-target:/cargo-target
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    environment:
      <<: *backend-env
      API_BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://mlbpp_app:mlbpp_app_dev@postgres:5432/mlbpp # gitleaks:allow
      DATABASE_MIGRATION_URL: postgres://mlbpp_owner:mlbpp_owner_dev@postgres:5432/mlbpp # gitleaks:allow
      TENANCY_MODE: single
      TENANT_DEFAULT_SLUG: default
      # Readable logs in the terminal; production writes JSON lines.
      LOG_FORMAT: text
    command:
      - watchexec
      - --restart
      - --watch=crates
      - --watch=migrations
      - --exts=rs,toml,sql
      # File events do not cross the Docker Desktop VM boundary: poll instead.
      - --poll=1s
      - --stop-signal=SIGTERM
      - --
      - cargo run --locked -p api
    ports:
      - "127.0.0.1:18080:8080"

  web:
    build:
      context: .
      dockerfile: dev/web.Dockerfile
    image: mlbpp-dev-web
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    volumes:
      - ..:/workspace
      - ${NPM_CACHE_MOUNT:-npm-cache}:/npm-cache
    # File events do not cross the Docker Desktop VM boundary: poll instead.
    command: ["npx", "ng", "serve", "app", "--host", "0.0.0.0", "--port", "4200", "--poll", "1000"]
    ports:
      - "127.0.0.1:4200:4200"
    profiles: ["web"]

  e2e:
    build:
      context: .
      dockerfile: dev/e2e.Dockerfile
    image: mlbpp-dev-e2e
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    volumes:
      - ..:/workspace
      - ${NPM_CACHE_MOUNT:-npm-cache}:/npm-cache
    # Chromium needs more shared memory than Docker's default 64 MB.
    ipc: host
    profiles: ["e2e"]

volumes:
  postgres-data:
  cargo-home:
  cargo-target:
  api-target:
  npm-cache:
