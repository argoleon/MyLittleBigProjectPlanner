# Prometheus of the "observability" profile. The application services expose
# their metrics with L01-US08 (OpenTelemetry); for now Traefik's metrics
# (requests, latency, errors per service) are collected.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
