# Dashboards provisioned in Grafana ("observability" profile), from
# deploy/observability/dashboards/.
apiVersion: 1

providers:
  - name: mlbpp
    folder: My Little Big Project Planner
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/mlbpp
