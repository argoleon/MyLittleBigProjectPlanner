[workspace]
resolver = "3"
members = ["crates/domain", "crates/infra", "crates/api", "crates/worker", "crates/mcp", "crates/testkit"]
# Fixture of scripts/check-deny-policy.sh, never built.
exclude = ["deny-fixture"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/argoleon/MyLittleBigProjectPlanner"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
infra = { path = "crates/infra" }
testkit = { path = "crates/testkit" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
uuid = { version = "1.29.1", features = ["v7", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# A pragmatic subset of pedantic lints: catch real mistakes without
# pushing beginners towards clever code.
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Test binaries (one per integration test file, each linking the whole
# workspace) are large with full debug info: together they outgrew the disk
# of a CI runner. Line tables keep file:line in backtraces and panics;
# dependencies keep no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Argon2id is slow on purpose; unoptimized, a single hash takes seconds and
# the authentication tests crawl. Optimize the hashing crates in dev builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
