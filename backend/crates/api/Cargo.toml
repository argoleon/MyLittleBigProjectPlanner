[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sqlx.workspace = true
uuid = { workspace = true, features = ["v4"] }
infra.workspace = true
axum = { version = "0.8.9", features = ["macros"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "timeout", "limit", "util", "catch-panic", "set-header"] }
tracing = "0.1.44"
domain.workspace = true
base64 = "0.23.1"
sha2 = "0.11.1"
chrono.workspace = true
utoipa = { version = "6.0.0", features = ["uuid", "chrono", "axum_extras"] }
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.2", default-features = false, features = ["axum", "vendored"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics"] }
tracing-opentelemetry = "0.34.0"

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
http-body-util = "0.1.5"
jsonschema = { version = "0.61.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
testkit.workspace = true
worker = { path = "../worker" }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "testing"] }
