[package]
name = "infra"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
uuid.workspace = true
domain.workspace = true
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["signal", "macros", "rt", "net", "io-util", "time"] }
tracing = "0.1.44"
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-native-certs"] }
argon2 = "0.6.0"
rand = "0.10.3"
fred = { version = "10.1.0", default-features = false, features = ["i-keys", "i-sets"] }
base64 = "0.23.1"
sha2 = "0.11.1"
aes-gcm = "0.11.1"
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "otpauth"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
# OIDC: ID tokens checked by jsonwebtoken, its signatures by ring through our
# own provider (crate::jwt_crypto: neither of its backends, see there); HTTPS
# by hyper-rustls with ring and the system's certificates (no aws-lc, no
# webpki-roots).
jsonwebtoken = { version = "10.3.0", default-features = false }
ring = "0.17"
signature = "2"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["native-tokio", "http1", "tls12", "ring"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"

[dev-dependencies]
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"] }
tempfile = "3.27.0"
testkit.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
