<a class="skip-link" href="#main" (click)="skipToMain($event)">{{ 'shell.skipToContent' | transloco }}</a>

<mat-sidenav-container class="container">
  <mat-sidenav
    class="drawer"
    [mode]="modal() ? 'over' : 'side'"
    [opened]="!modal()"
    [fixedInViewport]="modal()"
  >
    <div class="brand">
      <mat-icon class="brand-icon" aria-hidden="true">{{ brandIcon() }}</mat-icon>
      <span class="brand-name">{{ appNameKey() | transloco }}</span>
    </div>

    <ng-content select="[uiShellDrawerHeader]" />

    <nav [attr.aria-label]="'shell.mainNavigation' | transloco">
      <mat-nav-list class="nav">
        @for (item of navItems(); track item.route) {
          <a
            mat-list-item
            [routerLink]="item.route"
            routerLinkActive
            #link="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            ariaCurrentWhenActive="page"
            [activated]="link.isActive"
          >
            <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.labelKey | transloco }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <header>
      <mat-toolbar class="top-bar">
        @if (modal()) {
          <button matIconButton type="button" (click)="openDrawer()" [attr.aria-label]="'shell.openNavigation' | transloco">
            <mat-icon aria-hidden="true">menu</mat-icon>
          </button>
        }
        <span class="spacer"></span>
        <ui-language-menu />
        <ui-theme-menu />
        <ng-content select="[uiShellTopBar]" />
      </mat-toolbar>
    </header>

    <main #main id="main" class="main" tabindex="-1">
      <ng-content />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
