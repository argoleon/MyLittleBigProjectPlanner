<h1 class="title">{{ 'nav.portfolios' | transloco }}</h1>
<div class="toolbar">
  <p class="intro">{{ 'hierarchy.intro' | transloco }}</p>
  @if (canCreate()) {
    <button matButton="filled" type="button" class="create" (click)="create()">
      <mat-icon aria-hidden="true">add</mat-icon>
      {{ 'hierarchy.add' | transloco }}
    </button>
  }
</div>

<app-hierarchy-tree [caption]="'hierarchy.caption' | transloco">
  <ui-empty-state icon="account_tree" [title]="'hierarchy.empty' | transloco" [message]="'hierarchy.emptyHint' | transloco" />
</app-hierarchy-tree>
